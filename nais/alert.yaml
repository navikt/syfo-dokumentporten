apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: syfo-dokumentporten-alerts
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  groups:
    - name: syfo-dokumentporten-alerts
      rules:
        - alert: syfo-dokumentporten-varselinstruks-terminal-error
          expr: sum(increase(syfo_dokumentporten_varsel_permanent_error_total{app="syfo-dokumentporten",namespace="team-esyfo"}[5m])) > 0
          for: 1m
          labels:
            severity: critical
            namespace: team-esyfo
          annotations:
            description: "Varselinstruks har gått til terminal ERROR etter permanente publiseringsfeil eller oppbrukt retry-terskel."
            action: "Undersøk logger for varselpublisering mot esyfovarsel og følg opp varselinstrukser som har stoppet i terminal ERROR."
        - alert: syfo-dokumentporten-transmission-opened-permanent-failure
          expr: sum(increase(syfo_dokumentporten_dialogporten_transmission_opened_activities_permanently_failed_total{app="syfo-dokumentporten",namespace="team-esyfo"}[5m])) > 0
          for: 1m
          labels:
            severity: warning
            namespace: team-esyfo
          annotations:
            description: "TransmissionOpened-aktiviteter er permanent avvist av Dialogporten (404/410/422) og blir ikke forsøkt sendt på nytt."
            action: "Undersøk logger for «Stopped retrying TransmissionOpened activity» og følg opp dokumenter med transmission_opened_failed_at satt."
